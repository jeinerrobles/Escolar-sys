<div class="container-fluid mt-4">


  <div class="card shadow-lg border-0 rounded-4">

    <!-- HEADER -->
    <div class="card-header bg-gradient-primary text-white rounded-top-4 d-flex justify-content-between align-items-center flex-wrap gap-2">
      <h5 class="mb-0">
        <i class="bi bi-pencil-square me-2"></i>
        Crear Curso
      </h5>
    </div>

    <div class="card-body p-4">

      <form (ngSubmit)="crearCurso()">

        <!-- ========================= -->
        <!-- DATOS DEL CURSO -->
        <!-- ========================= -->

        <h6 class="fw-bold text-primary mb-3">
          <i class="bi bi-info-circle me-1"></i> Información del curso
        </h6>

        <div class="row g-3">

          <div class="col-md-6">
            <label class="form-label fw-semibold">Nombre *</label>
            <input type="text"
                   [(ngModel)]="curso.nombre"
                   name="nombre"
                   class="form-control shadow-sm"
                   placeholder="Ej: Matemáticas 5°A"
                   required />
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">Grado</label>
            <select [(ngModel)]="curso.id_grado"
                    name="id_grado"
                    class="form-select shadow-sm">

              <option *ngFor="let grado of grados"
                      [value]="grado.id">
                {{ grado.nombre }}
              </option>

            </select>
          </div>

          <div class="col-12">
            <label class="form-label fw-semibold">Descripción</label>
            <textarea [(ngModel)]="curso.descripcion"
                      name="descripcion"
                      class="form-control shadow-sm"
                      rows="2"
                      placeholder="Descripción opcional del curso">
            </textarea>
          </div>

        </div>

        <!-- ========================= -->
        <!-- DIRECTOR DE GRUPO -->
        <!-- ========================= -->

        <hr class="my-4">

        <h6 class="fw-bold text-primary mb-3">
          <i class="bi bi-person-badge me-1"></i> Director de grupo
        </h6>
        <div class="row g-3">

          <!-- Buscador -->
          <div class="col-md-6">
            <label class="form-label">Buscar profesor</label>

            <input type="text"
                   class="form-control shadow-sm mb-2"
                   placeholder="Buscar profesor..."
                   [(ngModel)]="filtroProfesor"
                   name="filtroProfesor"
                   (input)="filtrarProfesores()">
          </div>

          <!-- Selector -->
          <div class="col-md-6">
            <label class="form-label">Seleccionar director</label>

            <select [(ngModel)]="curso.profesorId"
                    name="profesorId"
                    class="form-select shadow-sm">

              <option *ngFor="let profesor of profesoresFiltrados"
                      [value]="profesor.id">
                {{ profesor.nombre }}
              </option>

            </select>

            <div *ngIf="profesoresFiltrados.length === 0"
                 class="text-warning small mt-1">
              <i class="bi bi-info-circle"></i>
              No se encontraron profesores
            </div>

          </div>

        </div>

        <!-- ========================= -->
        <!-- ESTUDIANTES -->
        <!-- ========================= -->

        <hr class="my-4">

        <h6 class="fw-bold text-primary mb-3">
          <i class="bi bi-people me-1"></i> Asignar estudiantes
        </h6>

        <!-- BUSCADOR -->
        <div class="mb-3">
          <input type="text"
                 class="form-control shadow-sm"
                 placeholder="Buscar por nombre o email..."
                 [(ngModel)]="terminoBusqueda"
                 name="terminoBusqueda"
                 (input)="aplicarFiltroEstudiantes()">
        </div>

        <!-- SIN RESULTADOS -->
        <div *ngIf="estudiantesFiltrados.length === 0"
             class="alert alert-warning text-center shadow-sm">

          <ng-container *ngIf="terminoBusqueda; else sinEstudiantes">
            <i class="bi bi-search me-1"></i>
            No se encontraron estudiantes con ese filtro
          </ng-container>

          <ng-template #sinEstudiantes>
            <i class="bi bi-info-circle me-1"></i>
            No hay estudiantes registrados
          </ng-template>

        </div>

        <!-- TABLA -->
        <div class="table-responsive"
             *ngIf="estudiantesFiltrados.length > 0">

          <table class="table table-hover align-middle border">

            <thead class="table-light">
            <tr>

              <th style="width:50px;text-align:center;">
                <input type="checkbox"
                       [(ngModel)]="selectAll"
                       name="selectAll"
                       (change)="toggleAllEstudiantes()" />
              </th>

              <th>Nombre</th>
              <th>Email</th>

            </tr>
            </thead>

            <tbody>

            <tr *ngFor="let est of estudiantesPaginados">

              <td class="text-center">
                <input type="checkbox"
                       [(ngModel)]="est.seleccionado"
                       name="est_{{ est.id }}" />
              </td>

              <td class="fw-medium">{{ est.nombre }}</td>
              <td class="text-muted">{{ est.email }}</td>

            </tr>

            </tbody>

          </table>

        </div>

        <!-- PAGINACIÓN -->
        <nav *ngIf="totalPaginas > 1" class="mt-3">
          <ul class="pagination justify-content-center">

            <li class="page-item" [class.disabled]="paginaActual === 1">
              <button type="button"
                      class="page-link"
                      (click)="cambiarPagina(paginaActual - 1)">
                ←
              </button>
            </li>

            <li class="page-item"
                *ngFor="let p of [].constructor(totalPaginas); let i = index"
                [class.active]="paginaActual === i + 1">

              <button type="button"
                      class="page-link"
                      (click)="cambiarPagina(i + 1)">
                {{ i + 1 }}
              </button>
            </li>

            <li class="page-item" [class.disabled]="paginaActual === totalPaginas">
              <button type="button"
                      class="page-link"
                      (click)="cambiarPagina(paginaActual + 1)">
                →
              </button>
            </li>

          </ul>
        </nav>

        <!-- BOTONES -->
        <div class="d-flex justify-content-end gap-2 mt-4">

          <button class="btn btn-primary px-4" type="submit">
            <i class="bi bi-check-circle me-1"></i>
            Guardar
          </button>

          <button routerLink="/panel/cursos"
                  class="btn btn-outline-secondary px-4">
            Cancelar
          </button>

        </div>

      </form>

    </div>
  </div>
</div>
