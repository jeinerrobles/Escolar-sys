<div class="container mt-4">
  <div class="card shadow-sm">

    <div class="card-header bg-primary text-white">
      <h5 class="mb-0">Crear Curso</h5>
    </div>

    <div class="card-body">
      <form (ngSubmit)="crearCurso()">

        <!-- ========================= -->
        <!-- DATOS DEL CURSO -->
        <!-- ========================= -->

        <div class="mb-3">
          <label class="form-label">Nombre</label>
          <input type="text"
                 [(ngModel)]="curso.nombre"
                 name="nombre"
                 class="form-control"
                 required />
        </div>

        <div class="mb-3">
          <label class="form-label">Descripción</label>
          <textarea [(ngModel)]="curso.descripcion"
                    name="descripcion"
                    class="form-control">
          </textarea>
        </div>

        <div class="mb-3">
          <label class="form-label">Grado</label>
          <select [(ngModel)]="curso.id_grado"
                  name="id_grado"
                  class="form-select">

            <option *ngFor="let grado of grados"
                    [value]="grado.id">
              {{ grado.nombre }}
            </option>

          </select>
        </div>


        <!-- ========================= -->
        <!-- DIRECTOR DE GRUPO -->
        <!-- ========================= -->

        <div class="mb-3">
          <label class="form-label">Director de grupo</label>

          <!-- 🔎 Buscador -->
          <input type="text"
                 class="form-control mb-2"
                 placeholder="Buscar profesor..."
                 [(ngModel)]="filtroProfesor"
                 name="filtroProfesor"
                 (input)="filtrarProfesores()">

          <!-- 📋 Selector -->
          <select [(ngModel)]="curso.profesorId"
                  name="profesorId"
                  class="form-select">

            <option *ngFor="let profesor of profesoresFiltrados"
                    [value]="profesor.id">
              {{ profesor.nombre }}
            </option>

          </select>
        </div>


        <!-- ========================= -->
        <!-- ESTUDIANTES -->
        <!-- ========================= -->

        <h5 class="mt-4">👩‍🎓 Asignar Estudiantes</h5>

        <!-- 🔎 BUSCADOR -->
        <div class="mb-3">
          <input type="text"
                 class="form-control"
                 placeholder="Buscar estudiante..."
                 [(ngModel)]="terminoBusqueda"
                 name="terminoBusqueda"
                 (input)="aplicarFiltroEstudiantes()">
        </div>



        <div *ngIf="estudiantesFiltrados.length === 0"
             class="alert alert-warning text-center">

          <ng-container *ngIf="terminoBusqueda; else sinEstudiantes">
            No se encontraron estudiantes con ese filtro.
          </ng-container>

          <ng-template #sinEstudiantes>
            No hay estudiantes registrados.
          </ng-template>

        </div>


        <!-- 📋 TABLA -->
        <div class="table-responsive"
             *ngIf="estudiantesFiltrados.length > 0">

          <table class="table table-striped table-bordered mt-2">

            <thead>
            <tr>

              <!-- SELECT ALL -->
              <th style="width: 50px; text-align:center;">
                <input type="checkbox"
                       [(ngModel)]="selectAll"
                       name="selectAll"
                       (change)="toggleAllEstudiantes()" />
              </th>

              <th>Nombre</th>
              <th>Email</th>

            </tr>
            </thead>

            <tbody>

            <tr *ngFor="let est of estudiantesPaginados">

              <td style="text-align:center;">
                <input type="checkbox"
                       [(ngModel)]="est.seleccionado"
                       name="est_{{ est.id }}" />
              </td>

              <td>{{ est.nombre }}</td>
              <td>{{ est.email }}</td>

            </tr>

            </tbody>

          </table>

        </div>


        <!-- 📄 PAGINACIÓN -->
        <nav *ngIf="totalPaginas > 1">
          <ul class="pagination justify-content-center">

            <li class="page-item" [class.disabled]="paginaActual === 1">
              <button type="button"
                      class="page-link"
                      (click)="cambiarPagina(paginaActual - 1)">
                Anterior
              </button>
            </li>

            <li class="page-item"
                *ngFor="let p of [].constructor(totalPaginas); let i = index"
                [class.active]="paginaActual === i + 1">

              <button type="button"
                      class="page-link"
                      (click)="cambiarPagina(i + 1)">
                {{ i + 1 }}
              </button>
            </li>

            <li class="page-item" [class.disabled]="paginaActual === totalPaginas">
              <button type="button"
                      class="page-link"
                      (click)="cambiarPagina(paginaActual + 1)">
                Siguiente
              </button>
            </li>

          </ul>
        </nav>


        <!-- ========================= -->
        <!-- BOTONES -->
        <!-- ========================= -->

        <div class="mt-4 d-flex gap-2">
          <button class="btn btn-success" type="submit">
            Guardar
          </button>

          <button routerLink="/panel/cursos"
                  class="btn btn-secondary">
            Cancelar
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
