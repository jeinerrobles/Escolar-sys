<div class="container-fluid mt-4">

  <!-- HEADER -->
  <div class="card shadow-lg border-0 rounded-4">

    <div class="card-header bg-gradient-primary text-white rounded-top-4 d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div class="d-flex align-items-center">
        <i class="bi bi-people-fill me-2 fs-4"></i>
        <h5 class="mb-0 fw-semibold">Gestión de Usuarios</h5>
      </div>

      <button routerLink="crear"
              class="btn btn-light btn-sm shadow-sm">
        <i class="bi bi-person-plus me-1"></i>
        Nuevo Usuario
      </button>

    </div>

    <div class="card-body p-4">

      <!-- 🔎 BUSCADOR -->
      <div class="input-group mb-3">
        <span class="input-group-text bg-light">
          <i class="bi bi-search"></i>
        </span>

        <input type="text"
               class="form-control"
               placeholder="Buscar por nombre, email o rol..."
               [(ngModel)]="terminoBusqueda"
               (input)="aplicarFiltro()" />
      </div>

      <!-- TABLA -->
      <div class="table-responsive"
           *ngIf="usuariosFiltrados.length > 0">

        <table class="table table-hover align-middle border">

          <thead class="table-light">
          <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Rol</th>
            <th class="text-center">Acciones</th>
          </tr>
          </thead>

          <tbody>

          <tr *ngFor="let u of usuariosPaginados">

            <td class="fw-semibold">
              {{ u.nombre }}
            </td>

            <td class="text-muted">
              {{ u.email }}
            </td>

            <td>
              <span class="badge px-3 py-2 text-bg-primary"
                    [ngClass]="{
                      'bg-primary': u.role === 'ADMIN',
                      'bg-success': u.role === 'PROFESOR',
                      'bg-secondary': u.role === 'ESTUDIANTE'
                    }">
                {{ u.role }}
              </span>
            </td>

            <td class="text-center">

              <button class="btn btn-outline-warning btn-sm me-2"
                      [routerLink]="['editar', u.id]">
                <i class="bi bi-pencil-square"></i>
              </button>

              <button class="btn btn-outline-danger btn-sm"
                      (click)="eliminarUsuario(u.id)">
                <i class="bi bi-trash"></i>
              </button>

            </td>

          </tr>

          </tbody>

        </table>

      </div>

      <!-- PAGINACIÓN -->
      <nav *ngIf="totalPaginas > 1" class="mt-4">
        <ul class="pagination justify-content-center">

          <li class="page-item"
              [class.disabled]="paginaActual === 1">
            <button class="page-link"
                    (click)="cambiarPagina(paginaActual - 1)">
              ←
            </button>
          </li>

          <li class="page-item"
              *ngFor="let p of [].constructor(totalPaginas); let i = index"
              [class.active]="paginaActual === i + 1">

            <button class="page-link"
                    (click)="cambiarPagina(i + 1)">
              {{ i + 1 }}
            </button>
          </li>

          <li class="page-item"
              [class.disabled]="paginaActual === totalPaginas">
            <button class="page-link"
                    (click)="cambiarPagina(paginaActual + 1)">
              →
            </button>
          </li>

        </ul>
      </nav>

      <!-- SIN RESULTADOS -->
      <div *ngIf="usuariosFiltrados.length === 0"
           class="text-center py-5">

        <i class="bi bi-journal-x display-4 text-warning"></i>

        <h5 class="mt-3">

          <ng-container *ngIf="terminoBusqueda; else sinUsuarios">
            No se encontraron usuarios con ese filtro
          </ng-container>

          <ng-template #sinUsuarios>
            No hay usuarios registrados
          </ng-template>

        </h5>

        <p class="text-muted">
          Ajustar la búsqueda
        </p>

      </div>

    </div>
  </div>
</div>
