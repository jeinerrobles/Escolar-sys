<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3><i class="bi bi-person-plus"></i> Gestión de Usuarios</h3>
    <a routerLink="crear" class="btn btn-primary">
      <i class="bi bi-person-plus"></i> Nuevo Usuario
    </a>
  </div>

  <!-- 🔍 BUSCADOR -->
  <div class="mb-3">
    <input type="text"
           class="form-control"
           placeholder="Buscar por nombre, email o rol..."
           [(ngModel)]="terminoBusqueda"
           (input)="aplicarFiltro()">
  </div>

  <table *ngIf="usuariosFiltrados.length > 0"
         class="table table-striped table-hover">
    <thead class="table-light">
    <tr>
      <th>Nombre</th>
      <th>Email</th>
      <th>Rol</th>
      <th>Acciones</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngFor="let u of usuariosPaginados">
      <td>{{ u.nombre }}</td>
      <td>{{ u.email }}</td>
      <td>
          <span class="badge bg-info text-dark">
            {{ u.role }}
          </span>
      </td>
      <td class="text-center">
        <button class="btn btn-outline-warning btn-sm me-2"
                [routerLink]="['editar', u.id]">
          <i class="bi bi-pencil-square"></i>
        </button>

        <button class="btn btn-outline-danger btn-sm"
                (click)="eliminarUsuario(u.id)">
          <i class="bi bi-trash"></i>
        </button>
      </td>
    </tr>
    </tbody>
  </table>

  <!-- 📄 PAGINACIÓN -->
  <nav *ngIf="totalPaginas > 1">
    <ul class="pagination justify-content-center">

      <li class="page-item" [class.disabled]="paginaActual === 1">
        <button class="page-link" (click)="cambiarPagina(paginaActual - 1)">
          Anterior
        </button>
      </li>

      <li class="page-item"
          *ngFor="let p of [].constructor(totalPaginas); let i = index"
          [class.active]="paginaActual === i + 1">

        <button class="page-link"
                (click)="cambiarPagina(i + 1)">
          {{ i + 1 }}
        </button>
      </li>

      <li class="page-item" [class.disabled]="paginaActual === totalPaginas">
        <button class="page-link" (click)="cambiarPagina(paginaActual + 1)">
          Siguiente
        </button>
      </li>

    </ul>
  </nav>

  <div *ngIf="usuariosFiltrados.length === 0"
       class="alert alert-warning text-center">

    <ng-container *ngIf="terminoBusqueda; else sinUsuarios">
      No se encontraron usuarios con ese filtro.
    </ng-container>

    <ng-template #sinUsuarios>
      No hay usuarios registrados.
    </ng-template>

  </div>

</div>
