<div class="container mt-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3><i class="bi bi-pencil-square"></i> Gestión de Materias</h3>

    <!-- SOLO ADMIN -->
    <button *ngIf="esAdmin"
            class="btn btn-primary"
            (click)="crearNueva()">
      <i class="bi bi-plus-circle"></i> Nueva Materia
    </button>
  </div>

  <!-- 🔎 BUSCADOR -->
  <div class="mb-3" *ngIf="!cargando">
    <input type="text"
           class="form-control"
           placeholder="Buscar por materia, profesor o grado..."
           [(ngModel)]="terminoBusqueda"
           name="busqueda"
           (input)="aplicarFiltro()" />
  </div>



  <!-- 📋 TABLA -->
    <table *ngIf="materiasPaginadas.length > 0"
           class="table table-bordered table-hover align-middle">

    <thead class="table-light">
    <tr>
      <th>Materia</th>
      <th>Profesor</th>
      <th>Grados Asignados</th>
      <th *ngIf="esAdmin">Acciones</th>
    </tr>
    </thead>

    <tbody>
    <tr *ngFor="let m of materiasPaginadas">

      <td>{{ m.nombre }}</td>

      <td>
          <span *ngIf="m.profesor; else noProfesor">
            {{ m.profesor.nombre }}
          </span>

        <ng-template #noProfesor>
          <span class="text-muted">Sin profesor</span>
        </ng-template>
      </td>

      <td>
          <span *ngFor="let g of m.grados"
                class="badge bg-info text-dark me-1">
            {{ g.nombre }}
          </span>
      </td>

      <!-- SOLO ADMIN -->
      <td *ngIf="esAdmin" class="text-center">

        <button class="btn btn-outline-warning btn-sm me-2"
                [routerLink]="['editar', m.id]">
          <i class="bi bi-pencil-square"></i>
        </button>

        <button class="btn btn-outline-danger btn-sm"
                (click)="eliminar(m.id)">
          <i class="bi bi-trash"></i>
        </button>

      </td>
    </tr>
    </tbody>
  </table>

  <!--  PAGINACIÓN -->
  <nav *ngIf="totalPaginas > 1">
    <ul class="pagination justify-content-center">

      <li class="page-item" [class.disabled]="paginaActual === 1">
        <button type="button"
                class="page-link"
                (click)="cambiarPagina(paginaActual - 1)">
          Anterior
        </button>
      </li>

      <li class="page-item"
          *ngFor="let p of [].constructor(totalPaginas); let i = index"
          [class.active]="paginaActual === i + 1">

        <button type="button"
                class="page-link"
                (click)="cambiarPagina(i + 1)">
          {{ i + 1 }}
        </button>
      </li>

      <li class="page-item" [class.disabled]="paginaActual === totalPaginas">
        <button type="button"
                class="page-link"
                (click)="cambiarPagina(paginaActual + 1)">
          Siguiente
        </button>
      </li>

    </ul>
  </nav>
  <div *ngIf="materiasFiltradas.length === 0"
       class="alert alert-warning text-center">

    <ng-container *ngIf="terminoBusqueda; else sinMaterias">
      <i class="bi bi-info-circle"></i> No se encontraron materias con ese filtro.
    </ng-container>

    <ng-template #sinMaterias>
      <i class="bi bi-info-circle"></i> No hay materias registradas.
    </ng-template>

  </div>

</div>
