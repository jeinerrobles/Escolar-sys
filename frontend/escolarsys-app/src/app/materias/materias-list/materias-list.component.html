<div class="container-fluid mt-4">

  <div class="card shadow-lg border-0 rounded-4">

    <!-- HEADER -->

    <div class="card-header bg-gradient-primary text-white rounded-top-4 d-flex justify-content-between align-items-center flex-wrap gap-2">
      <div class="d-flex align-items-center">
        <i class="bi bi-journal-text me-2 fs-4"></i>
        <h5 class="mb-0 fw-semibold">Gestión de Materias</h5>
      </div>

      <button *ngIf="esAdmin"
              class="btn btn-light btn-sm shadow-sm"
              (click)="crearNueva()">
        <i class="bi bi-plus-circle me-1"></i>
        Nueva Materia
      </button>
    </div>

    <!-- BODY -->
    <div class="card-body p-4">

      <!-- 🔎 BUSCADOR PROFESIONAL -->
      <div class="input-group mb-3" *ngIf="!cargando">
        <span class="input-group-text bg-light">
          <i class="bi bi-search"></i>
        </span>

        <input type="text"
               class="form-control"
               placeholder="Buscar por materia, profesor o grado..."
               [(ngModel)]="terminoBusqueda"
               name="busqueda"
               (input)="aplicarFiltro()" />
      </div>

      <!-- 📋 TABLA RESPONSIVE -->
      <div class="table-responsive">

        <table *ngIf="materiasPaginadas.length > 0"
               class="table table-hover align-middle table-bordered">

          <thead class="table-light">
          <tr>
            <th>Materia</th>
            <th>Profesor</th>
            <th>Grados Asignados</th>
            <th *ngIf="esAdmin" class="text-center">Acciones</th>
          </tr>
          </thead>

          <tbody>
          <tr *ngFor="let m of materiasPaginadas">

            <!-- MATERIA -->
            <td class="fw-semibold text-primary">
              {{ m.nombre }}
            </td>

            <!-- PROFESOR -->
            <td>
              <span *ngIf="m.profesor; else noProfesor">
                <i class="bi bi-person-circle me-1 text-muted"></i>
                {{ m.profesor.nombre }}
              </span>

              <ng-template #noProfesor>
                <span class="text-muted fst-italic">
                  Sin profesor
                </span>
              </ng-template>
            </td>

            <!-- GRADOS -->
            <td>
              <span *ngFor="let g of m.grados"
                    class="badge rounded-pill bg-info text-dark me-1 mb-1">
                {{ g.nombre }}
              </span>
            </td>

            <!-- ACCIONES ADMIN -->
            <td *ngIf="esAdmin" class="text-center">

              <button class="btn btn-outline-warning btn-sm me-2"
                      [routerLink]="['editar', m.id]"
                      title="Editar">
                <i class="bi bi-pencil"></i>
              </button>

              <button class="btn btn-outline-danger btn-sm"
                      (click)="eliminar(m.id)"
                      title="Eliminar">
                <i class="bi bi-trash"></i>
              </button>

            </td>

          </tr>
          </tbody>

        </table>

      </div>

      <!-- 📄 PAGINACIÓN -->
      <nav *ngIf="totalPaginas > 1" class="mt-3">
        <ul class="pagination justify-content-center mb-0">

          <li class="page-item" [class.disabled]="paginaActual === 1">
            <button type="button"
                    class="page-link"
                    (click)="cambiarPagina(paginaActual - 1)">
              ←
            </button>
          </li>

          <li class="page-item"
              *ngFor="let p of [].constructor(totalPaginas); let i = index"
              [class.active]="paginaActual === i + 1">

            <button type="button"
                    class="page-link"
                    (click)="cambiarPagina(i + 1)">
              {{ i + 1 }}
            </button>
          </li>

          <li class="page-item" [class.disabled]="paginaActual === totalPaginas">
            <button type="button"
                    class="page-link"
                    (click)="cambiarPagina(paginaActual + 1)">
              →
            </button>
          </li>

        </ul>
      </nav>

      <!-- ⚠️ ESTADO VACÍO BONITO -->
      <div *ngIf="materiasFiltradas.length === 0"
           class="text-center py-5">

        <i class="bi bi-journal-x display-4 text-warning"></i>

        <h5 class="mt-3">

          <ng-container *ngIf="terminoBusqueda; else sinMaterias">
            No se encontraron materias con ese filtro
          </ng-container>

          <ng-template #sinMaterias>
            No hay materias registradas
          </ng-template>

        </h5>

        <p class="text-muted">
          Ajustar la búsqueda
        </p>

      </div>

    </div>

  </div>

</div>
