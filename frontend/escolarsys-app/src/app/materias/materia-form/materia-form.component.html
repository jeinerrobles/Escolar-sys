<div class="container-fluid mt-4">

  <div class="card shadow-lg border-0 rounded-4">

    <!-- HEADER -->
    <div class="card-header bg-gradient-primary text-white rounded-top-4 d-flex justify-content-between align-items-center flex-wrap gap-2">

      <h5 class="mb-0">
        <i class="bi me-2"
           [ngClass]="editMode ? 'bi-pencil-square' : 'bi-plus-circle'"></i>

        {{ editMode ? 'Editar Materia' : 'Nueva Materia' }}
      </h5>

    </div>

    <!-- BODY -->
    <div class="card-body">

      <form [formGroup]="materiaForm" (ngSubmit)="guardar()">

        <div class="row g-3">

          <!-- NOMBRE -->
          <div class="col-md-4">

            <label for="nombre" class="form-label fw-semibold">
              Nombre de la materia <span class="text-danger">*</span>
            </label>

            <input type="text"
                   id="nombre"
                   formControlName="nombre"
                   class="form-control"
                   placeholder="Ej: Matemáticas, Ciencias Naturales..." />

            <div *ngIf="materiaForm.get('nombre')?.invalid && materiaForm.get('nombre')?.touched"
                 class="text-danger small mt-1">
              El nombre es obligatorio (mínimo 3 caracteres)
            </div>

          </div>

          <!-- PROFESOR -->
          <div class="col-md-4">

            <label for="profesor" class="form-label fw-semibold">
             Filtro
            </label>

            <!-- 🔎 BUSCADOR -->
            <div class="input-group mb-0">
              <span class="input-group-text bg-light">
                <i class="bi bi-search"></i>
              </span>

              <input type="text"
                     class="form-control"
                     placeholder="Buscar profesor..."
                     [(ngModel)]="filtroProfesor"
                     (input)="filtrarProfesores()"
                     [ngModelOptions]="{standalone: true}" />
            </div>
          </div>

          <div class="col-md-4">
            <!-- SELECT -->
            <label for="profesor" class="form-label fw-semibold">
              Profesor asignado
            </label>
            <select id="profesor"
                    formControlName="id_profesor"
                    class="form-select">

              <option value="">— Sin asignar —</option>

              <option *ngFor="let p of profesoresFiltrados"
                      [value]="p.id">
                {{ p.nombre }}
              </option>

            </select>

            <!-- ⚠️ SIN RESULTADOS -->
            <div *ngIf="profesoresFiltrados.length === 0"
                 class="text-warning small mt-1">
              <i class="bi bi-info-circle"></i>
              No se encontraron profesores con ese filtro
            </div>

          </div>

          <!-- GRADOS -->
          <div class="col-12">

            <label class="form-label fw-semibold">
              Grados asociados <span class="text-danger">*</span>
            </label>

            <div class="card border rounded-3 p-3 bg-light-subtle">

              <div class="row">

                <div class="col-6 col-md-3"
                     *ngFor="let grado of grados">

                  <div class="form-check">

                    <input type="checkbox"
                           class="form-check-input"
                           [value]="grado.id"
                           (change)="onCheckboxChange($event)"
                           [checked]="materiaForm.value.grados.includes(grado.id)"
                           id="grado_{{ grado.id }}" />

                    <label class="form-check-label"
                           for="grado_{{ grado.id }}">
                      {{ grado.nombre }}
                    </label>

                  </div>

                </div>

              </div>

            </div>

            <!-- BADGES SELECCIONADOS -->
            <div class="mt-3"
                 *ngIf="materiaForm.value.grados?.length > 0">

              <span *ngFor="let idg of materiaForm.value.grados"
                    class="badge rounded-pill bg-primary me-1 mb-1">

                <ng-container *ngFor="let g of grados">
                  <ng-container *ngIf="g.id == idg">
                    {{ g.nombre }}
                  </ng-container>
                </ng-container>

              </span>

            </div>

          </div>

        </div>

        <!-- BOTONES -->
        <div class="d-flex justify-content-end gap-2 mt-4 border-top pt-3">

          <button type="submit"
                  class="btn btn-primary px-4"
                  [disabled]="materiaForm.invalid">

            <i class="bi bi-check-circle"></i>

            {{ editMode ? 'Actualizar' : 'Guardar' }}

          </button>

          <button type="button"
                  class="btn btn-outline-secondary"
                  (click)="cancelar()">
            Cancelar
          </button>

        </div>

      </form>

    </div>

  </div>

</div>
