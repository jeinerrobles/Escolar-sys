<div class="container mt-4">
  <h4>
    <i class="bi bi-calendar-range"></i> Control de Periodos Académicos (Habilitar/Cerrar)
  </h4>

  <div class="card p-3 mt-3">

    <div
      class="form-check form-switch mb-2"
      *ngFor="let p of periodos"
    >
      <input
        class="form-check-input"
        type="checkbox"
        [checked]="p.habilitado"
        (change)="togglePeriodo(p)"
      />

      <label class="form-check-label">
        Periodo {{ p.periodo }}
      </label>
    </div>

  </div>
</div>
