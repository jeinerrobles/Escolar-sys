<div class="main-layout">
  <!-- Sidebar -->
  <nav [class.collapsed]="isSidebarCollapsed" class="sidebar">
    <div class="sidebar-header">
      <h3> EscolarSys</h3>
      <button class="btn btn-sm btn-toggle" (click)="toggleSidebar()">
        <i class="bi" [ngClass]="isSidebarCollapsed ? 'bi-list' : 'bi-x'"></i>
      </button>
    </div>

    <ul class="nav flex-column">
      <li class="nav-item" *ngFor="let item of menuItems">

        <!-- ITEM NORMAL (SIN HIJOS) -->
        <a
          *ngIf="!item.children"
          class="nav-link"
          [routerLink]="item.route"
          routerLinkActive="active"
        >
          <i [class]="item.icon"></i>
          <span *ngIf="!isSidebarCollapsed">{{ item.label }}</span>
        </a>

        <!-- ITEM CON SUBMENÚ -->
        <div *ngIf="item.children">

          <div class="nav-link d-flex align-items-center">

            <!-- CLICK AQUÍ NAVEGA -->
            <span
              class="d-flex align-items-center flex-grow-1"
              [routerLink]="item.route"
              routerLinkActive="active"
            >
          <i [class]="item.icon"></i>
          <span *ngIf="!isSidebarCollapsed" class="ms-2">
            {{ item.label }}
          </span>
        </span>

            <!-- SOLO DESPLIEGA / CIERRA -->
            <i
              *ngIf="!isSidebarCollapsed"
              class="bi ms-auto"
              [ngClass]="openMenus[item.label] ? 'bi-chevron-up' : 'bi-chevron-down'"
              (click)="toggleSubmenu(item.label); $event.stopPropagation()"
            ></i>

          </div>

          <!-- SUBMENÚ -->
          <ul
            *ngIf="openMenus[item.label] && !isSidebarCollapsed"
            class="nav flex-column ms-4"
          >
            <li class="nav-item" *ngFor="let child of item.children">
              <a
                class="nav-link"
                [routerLink]="child.route"
                routerLinkActive="active"
              >
                <i [class]="child.icon"></i>
                {{ child.label }}
              </a>
            </li>
          </ul>

        </div>

      </li>
    </ul>


  </nav>

  <!-- Main content -->
  <div class="content-area">
    <!-- Topbar -->
    <header class="topbar d-flex justify-content-between align-items-center px-3 py-2">
      <div class="d-flex align-items-center">
        <button class="btn btn-outline-light d-md-none me-2" (click)="toggleSidebar()">
          <i class="bi bi-list"></i>
        </button>
        <h5 class="m-0">Panel Administrativo</h5>
      </div>

      <div class="user-info dropdown">
        <a
          class="d-flex align-items-center text-decoration-none dropdown-toggle text-light"
          id="userDropdown"
          role="button"
          data-bs-toggle="dropdown"
          aria-expanded="false"
        >
          <img src="https://ui-avatars.com/api/?name={{user?.nombre}}&background=0D8ABC&color=fff" class="rounded-circle me-2" width="35" height="35" />
          <div class="text-start">
            <div class="fw-semibold">{{ user?.nombre || 'Usuario' }}</div>
            <small class="text-secondary">{{ user?.role || 'Sin rol' }}</small>
          </div>
        </a>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
          <li><a class="dropdown-item" href="#">Perfil</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger" (click)="logout()">Cerrar sesión</a></li>
        </ul>
      </div>
    </header>

    <main class="p-4">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
